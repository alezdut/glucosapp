services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: glucosapp_demo
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d glucosapp_demo"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - demo-data:/var/lib/postgresql/data
volumes:
  demo-data:
