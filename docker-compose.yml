services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: glucosapp
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
  api:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/glucosapp?schema=public
      JWT_ACCESS_SECRET: dev-access-secret-at-least-32-characters-long
      JWT_REFRESH_SECRET: dev-refresh-secret-at-least-32-characters-long
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      FRONTEND_URL: http://localhost:3001
      ALLOWED_ORIGINS: http://localhost:3001,http://localhost:8082
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
  web:
    image: node:20-alpine
    working_dir: /repo
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3000
    command: sh -lc "corepack enable && corepack prepare pnpm@9.12.2 --activate && pnpm install --frozen-lockfile && pnpm -C apps/web dev"
    ports:
      - "3001:3001"
    volumes:
      - .:/repo
    depends_on:
      - api

volumes:
  postgres-data:
