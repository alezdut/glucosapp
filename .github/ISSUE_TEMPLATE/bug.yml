name: Error
description: Reportar un error reproducible con datos sintéticos.
body:
  - type: markdown
    attributes:
      value: "No incluyas datos de salud ni secretos. Reportá vulnerabilidades mediante Security → Report a vulnerability."
  - type: textarea
    id: reproduction
    attributes:
      label: Versión, entorno y pasos para reproducir
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado y resultado observado
    validations:
      required: true
